<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supabase 雙人即時對戰遊戲</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; margin-bottom: 20px; color: var(--accent); }
    .hidden { display: none !important; }
    
    /* 輸入框與按鈕 */
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #475569; color: #fff; }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: var(--danger); color: #fff; }

    /* 房間列表 */
    .room-list { margin-top: 16px; list-style: none; }
    .room-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #0f172a;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    /* 遊戲對戰介面 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .player-box { text-align: center; flex: 1; }
    .hp-bar { color: var(--danger); font-weight: bold; font-size: 18px; }
    
    .question-card {
      background: #0f172a;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
    }
    .question-text { font-size: 24px; margin-bottom: 16px; font-weight: bold; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .option-btn {
      padding: 12px;
      background: #334155;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }
    .option-btn:hover { background: var(--accent); color: #0f172a; }
    
    .log-box {
      font-size: 12px;
      color: var(--text-dim);
      background: #0b0f19;
      padding: 8px;
      border-radius: 4px;
      height: 80px;
      overflow-y: auto;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚔️ 即時雙人對戰</h1>

    <!-- 階段 1：輸入暱稱與主選單 -->
    <div id="view-lobby">
      <input type="text" id="input-nickname" placeholder="請輸入您的暱稱..." />
      <button class="btn" onclick="createRoom()">建立新房間</button>
      <button class="btn btn-secondary" onclick="fetchLiveRooms()">重新整理房間列表</button>
      
      <h3 style="margin-top:20px; margin-bottom:10px;">可加入的房間：</h3>
      <ul id="room-list" class="room-list"></ul>
    </div>

    <!-- 階段 2：等待對手 -->
    <div id="view-waiting" class="hidden" style="text-align: center;">
      <h2 style="margin-bottom: 12px;">等待對手加入...</h2>
      <p style="color: var(--text-dim); margin-bottom: 20px;">分享這個畫面給朋友或開啟分頁測試</p>
      <button class="btn btn-danger" onclick="cancelRoom()">取消房間</button>
    </div>

    <!-- 階段 3：對戰中 -->
    <div id="view-game" class="hidden">
      <div class="status-bar">
        <div class="player-box">
          <div id="p1-name" style="font-weight: bold;">玩家 1</div>
          <div class="hp-bar">HP: <span id="p1-hp">7</span></div>
          <div>得分: <span id="p1-score">0</span></div>
        </div>
        <div style="font-size:24px; align-self: center;">VS</div>
        <div class="player-box">
          <div id="p2-name" style="font-weight: bold;">玩家 2</div>
          <div class="hp-bar">HP: <span id="p2-hp">7</span></div>
          <div>得分: <span id="p2-score">0</span></div>
        </div>
      </div>

      <div class="question-card">
        <div class="question-text" id="q-text">1 + 1 = ?</div>
        <div class="options-grid" id="q-options"></div>
      </div>

      <div class="log-box" id="log-box"></div>
    </div>
  </div>

  <script>
    // ⚠️ 請填入你的 Supabase 設定
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 產生專屬的使用者識別碼 Token
    let clientToken = localStorage.getItem("game_client_token");
    if (!clientToken) {
      clientToken = "user_" + Math.random().toString(36).substring(2, 10);
      localStorage.setItem("game_client_token", clientToken);
    }

    let currentRoomId = null;
    let heartbeatTimer = null;
    let currentSubscription = null;
    let currentQuestion = null;

    // --- 畫面切換 ---
    function showView(viewId) {
      ["view-lobby", "view-waiting", "view-game"].forEach(id => {
        document.getElementById(id).classList.add("hidden");
      });
      document.getElementById(viewId).classList.remove("hidden");
    }

    function logMsg(msg) {
      const box = document.getElementById("log-box");
      box.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
      box.scrollTop = box.scrollHeight;
    }

    function getNickname() {
      const val = document.getElementById("input-nickname").value.trim();
      return val || "匿名玩家";
    }

    // --- 大廳邏輯 ---
    async function fetchLiveRooms() {
      const { data, error } = await supabase.rpc("list_live_rooms");
      const listEl = document.getElementById("room-list");
      listEl.innerHTML = "";

      if (error) {
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        listEl.innerHTML = `<li style="color: var(--text-dim); text-align: center;">目前沒有開房中的房間</li>`;
        return;
      }

      data.forEach(room => {
        const li = document.createElement("li");
        li.className = "room-item";
        li.innerHTML = `
          <span><b>${room.host_nickname}</b> 的房間</span>
          <button class="btn" style="width:auto; margin:0; padding:6px 12px;" onclick="joinRoom('${room.id}')">加入對戰</button>
        `;
        listEl.appendChild(li);
      });
    }

    // --- 建立房間 ---
    async function createRoom() {
      const nickname = getNickname();
      const { data, error } = await supabase.rpc("create_room", {
        p_nickname: nickname,
        p_client_token: clientToken
      });

      if (error) {
        alert("建立房間失敗: " + error.message);
        return;
      }

      currentRoomId = data.room_id;
      showView("view-waiting");

      // 啟動心跳維護房主線上狀態
      heartbeatTimer = setInterval(() => {
        supabase.rpc("heartbeat_room", {
          p_room_id: currentRoomId,
          p_client_token: clientToken
        });
      }, 3000);

      // 監聽房間狀態變更 (等待玩家2加入)
      subscribeToGame();
    }

    // --- 加入房間 ---
    async function joinRoom(roomId) {
      const nickname = getNickname();
      const { data, error } = await supabase.rpc("join_room", {
        p_room_id: roomId,
        p_nickname: nickname,
        p_client_token: clientToken
      });

      if (error) {
        alert("無法加入房間: " + error.message);
        fetchLiveRooms();
        return;
      }

      currentRoomId = roomId;
      showView("view-game");
      generateQuestion();
      subscribeToGame();
    }

    // --- 取消房間 ---
    async function cancelRoom() {
      if (currentRoomId) {
        await supabase.rpc("cancel_room", {
          p_room_id: currentRoomId,
          p_client_token: clientToken
        });
      }
      cleanup();
      showView("view-lobby");
      fetchLiveRooms();
    }

    function cleanup() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      if (currentSubscription) supabase.removeChannel(currentSubscription);
      currentRoomId = null;
    }

    // --- 訂閱 Realtime 狀態廣播 ---
    function subscribeToGame() {
      currentSubscription = supabase
        .channel(`room_${currentRoomId}`)
        .on(
          'postgres_changes',
          {
            event: 'UPDATE',
            schema: 'public',
            table: 'game_state',
            filter: `room_id=eq.${currentRoomId}`
          },
          (payload) => {
            const gs = payload.new;
            updateGameUI(gs);
          }
        )
        .subscribe();
    }

    // --- 更新 UI 狀態 ---
    function updateGameUI(gs) {
      if (gs.status === 'playing') {
        if (heartbeatTimer) {
          clearInterval(heartbeatTimer);
          heartbeatTimer = null;
        }
        showView("view-game");
      }

      document.getElementById("p1-name").innerText = gs.player1_name || "玩家 1";
      document.getElementById("p1-hp").innerText = gs.player1_hp;
      document.getElementById("p1-score").innerText = gs.player1_score;

      document.getElementById("p2-name").innerText = gs.player2_name || "玩家 2";
      document.getElementById("p2-hp").innerText = gs.player2_hp;
      document.getElementById("p2-score").innerText = gs.player2_score;

      if (gs.last_event_type) {
        const actor = gs.last_event_seat === 1 ? gs.player1_name : gs.player2_name;
        if (gs.last_event_type === 'hit') {
          logMsg(`${actor} 答對了！扣除對手 1 HP`);
        } else if (gs.last_event_type === 'self_hit') {
          logMsg(`${actor} 答錯了！反扣自身 1 HP`);
        }
      }

      if (gs.status === 'finished') {
        const winnerName = gs.winner_seat === 1 ? gs.player1_name : gs.player2_name;
        alert(`🎉 遊戲結束！勝者是：${winnerName}`);
        cleanup();
        showView("view-lobby");
        fetchLiveRooms();
      }
    }

    // --- 出題邏輯 ---
    function generateQuestion() {
      const a = Math.floor(Math.random() * 20) + 1;
      const b = Math.floor(Math.random() * 20) + 1;
      const ans = a + b;
      
      currentQuestion = { ans };

      document.getElementById("q-text").innerText = `${a} + ${b} = ?`;
      
      const options = [ans, ans + 2, ans - 1, ans + 3].sort(() => Math.random() - 0.5);
      const grid = document.getElementById("q-options");
      grid.innerHTML = "";

      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt;
        btn.onclick = () => submitAnswer(opt === ans);
        grid.appendChild(btn);
      });
    }

    // --- 答題送出 RPC ---
    async function submitAnswer(isCorrect) {
      const { data, error } = await supabase.rpc("resolve_answer", {
        p_room_id: currentRoomId,
        p_client_token: clientToken,
        p_is_correct: isCorrect
      });

      if (error) {
        console.error(error);
        return;
      }

      // 答題完直接換下一題
      generateQuestion();
    }

    // 初始化頁面
    fetchLiveRooms();
  </script>
</body>
</html>
